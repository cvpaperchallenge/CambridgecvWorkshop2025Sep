services:
  frontend:
    build:
      args:
        - BASE_IMAGE=node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
        - PROJECT_NAME=${PROJECT_NAME_ENV}
        - SERVICE_NAME=frontend
        - USER_NAME=${USER_NAME_ENV}
        - GROUP_NAME=${GROUP_NAME_ENV}
        - UID=${HOST_UID:?error}
        - GID=${HOST_GID:?error}
        - RUN_YARN_INSTALL_AT_BUILD_TIME=true
      context: ../../
      dockerfile: environments/Dockerfile
    tty: true
    volumes:
        - ../../:/home/${USER_NAME_ENV}/${PROJECT_NAME_ENV}-frontend
        # exclude
        - /home/${USER_NAME_ENV}/${PROJECT_NAME_ENV}-frontend/node_modules